[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "veridex"
description = "LLM-powered API that scores e-commerce product pages for scam and dropshipping signals"
version = "0.5.0"
authors = [
    { name = "Floris van Beers", email = "freelancing@kroshtan.com" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12, <3.13"
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
    "asyncpg>=0.30",
    "bcrypt>=4.0",
    "beautifulsoup4~=4.13",
    "dynaconf~=3.2",
    "fastapi~=0.117.1",
    "httpx>=0.28.1",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "pillow>=11.0",
    "playwright>=1.58.0",
    "playwright-stealth>=2.0.2",
    "pydantic[email]~=2.11.9",
    "python-multipart~=0.0.20",
    "python-whois>=0.9.6",
    "structlog>=25.5.0",
    "uvicorn~=0.37.0",
]

[project.urls]
Repository = "https://github.com/kroshtan/veridex_backend"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.3.0",
    "pydoclint>=0.8.3",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.7.1",
    "ruff>=0.13.1",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"veridex" = ["settings.toml"]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = [
    # Annotations: missing (return) types
    "ANN",
    # Bugbear: common bug patterns or design problems
    "B",
    # Comprehensions: Write better list/set/dict comprehensions
    "C4",
    # Complexity: McCabe complexity checker
    "C90",
    # Pydocstyle: docstring conventions
    "D",
    # Pycodesyle: Style guide enforcement
    "E",
    # Pyflakes: Source files errors
    "F",
    # Logging format: Basic logging format errors
    "G",
    # Isort: import sorting
    "I",
    # Implicit namespace packages: Check if __init__.py is present
    "INP",
    # Implicit string concatenation
    "ISC",
    # Naming: Variable naming convention
    "N",
    # Perflint: Performance linting
    "PERF",
    # Pylint: enforcing more code standards
    "PL",
    # Refurb: modernize your code
    "FURB",
    # Simplify: Helps simplify your code
    "SIM",
    # Print: Forbid print statements
    "T20",
    # to do: Format to do comments
    "TD",
    # Ban relative imports
    "TID252",
    # Pyupgrade: Upgrade syntax to newer versions
    "UP",
]

ignore = [
    # Allow Any, allow untyped args and kwargs
    "ANN002", "ANN003", "ANN401",
    # Opinionated pydocstyle rules
    "D100", "D101", "D104", "D106", "D202", "D203", "D212", "D301", "D401", "D413",
    # Allow use of f-string in logging
    "G004",
    # Does not work with Ruff formatter
    "ISC001",
    # Allow to do without author or URL
    "TD002", "TD003",
    # Ignore some aggresive pylint rules
    "PLR0913", "PLR2004"
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    # Unused module imports in __init__.py
    "F401", "F403",
]
"tests/**" = [
    # Tests don't need docstrings, annotations on fixtures, or packages
    "D", "ANN", "INP001", "PLR2004",
]
"scripts/**" = [
    # Standalone CLI scripts
    "INP001", "T20",
]


[tool.ruff.lint.isort]
known-first-party = ["veridex"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["validator", "field_validator"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    # Allow initialization of FastAPI dependencies
    "fastapi.Header",
    "fastapi.Depends",
    "fastapi.Query",
]

[tool.mypy]
exclude = [".git", ".venv"]
ignore_missing_imports = true
disable_error_code = ['import-untyped']
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[tool.pydoclint]
exclude = "scripts|tests"
style = "sphinx"
allow-init-docstring = true
require-return-section-when-returning-nothing = false
check-return-types = false
check-yield-types = false
check-style-mismatch = true
arg-type-hints-in-docstring = false
should-document-star-arguments = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=veridex",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--strict-markers",
]
env = [
    "VERIDEX_OPENAI_API_KEY=test-key",
    "VERIDEX_PADDLE_WEBHOOK_SECRET=test-webhook-secret",
    "VERIDEX_SIGNUP_SECRET=test-signup-secret",
]

[tool.coverage.report]
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "def __repr__",
    "def __str__",
    "@abstractmethod",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
