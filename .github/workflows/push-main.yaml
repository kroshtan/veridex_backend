name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write   # REQUIRED for release-it
  packages: write   # REQUIRED for GHCR

env:
  environment: dev
  IMAGE_NAME: veridex_backend
  IMAGE_URI: ghcr.io/veridexai/veridex_backend

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run release-it
        run: |
          npm install -g release-it
          npm install -g @release-it/conventional-changelog
          npm install -g @release-it/bumper
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          release-it --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get new version
        id: get_version
        run: |
          VERSION=$(git describe --tags --abbrev=0)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_URI }}:${{ env.environment }}
            ${{ env.IMAGE_URI }}:${{ github.sha }}
            ${{ env.environment == 'prod' && format('{0}:latest', env.IMAGE_URI) || null }}
            ${{ env.environment == 'prod' && format('{0}:{1}', env.IMAGE_URI, env.version) || null }}

      - name: Delete older GHCR versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: "container"
          min-versions-to-keep: 2
          token: ${{ secrets.GH_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Trigger Render Deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
